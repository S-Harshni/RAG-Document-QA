<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Document QA</title>
<meta name="description" content="Retrieval-augmented question answering: BM25, dense and hybrid retrieval evaluated on 10,570 questions.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>RAG Document QA</h1>
      <p class="lede" id="lede">Loading…</p>
    </div>
    <div class="actions">
      <button class="ghost" type="button" id="theme">Dark mode</button>
      <a class="ghost" href="https://github.com/S-Harshni/RAG-Document-QA">Source on GitHub</a>
    </div>
  </header>
  <form class="ask" id="ask"><input id="q" aria-label="Question" placeholder="Ask a question about the documents" autocomplete="off"><button type="submit">Ask</button></form>
  <div class="chips" id="chips"></div>
  <main id="main"></main>
  <footer class="foot" id="foot"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
