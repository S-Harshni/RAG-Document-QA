[project]
name = "rag-document-qa"
version = "1.0.0"
description = "Retrieval-augmented question answering with BM25, dense and hybrid retrieval"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # SQL strings and test tables read better unwrapped
